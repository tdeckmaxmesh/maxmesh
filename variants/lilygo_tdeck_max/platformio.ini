; =============================================================================
;  LilyGo T-Deck MAX  -  MeshCore with a full on-device (standalone) UI
;  ESP32-S3 16MB/8MB PSRAM, SX1262, 3.1" GDEQ031T10 e-paper, TCA8418 keyboard,
;  BQ27220 gauge, DRV2605 haptics, XL9555 power expander, u-blox MIA-M10Q GPS
; =============================================================================

[LilyGo_TDeck_Max]
extends = esp32_base
board = t-deck-max
board_build.partitions = default_16MB.csv
build_flags =
  ${esp32_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/lilygo_tdeck_max
  -D LILYGO_TDECK_MAX
  -D BOARD_HAS_PSRAM=1
  -D CORE_DEBUG_LEVEL=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ESP32_CPU_FREQ=80            ; plenty for mesh + e-paper, big battery win
  -D PIN_BOARD_SDA=13
  -D PIN_BOARD_SCL=14
  -D PIN_USER_BTN=0
  ; ---- LoRa: SX1262 on the shared SPI bus ----
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=2.4f
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D P_LORA_NSS=3
  -D P_LORA_RESET=4
  -D P_LORA_DIO_1=5
  -D P_LORA_BUSY=6
  -D P_LORA_SCLK=36
  -D P_LORA_MOSI=33
  -D P_LORA_MISO=47
  ; default radio = MeshCore USA/Canada preset (changeable in Settings or the app)
  -D LORA_FREQ=910.525
  -D LORA_BW=62.5
  -D LORA_SF=7
  -D LORA_CR=5
  ; ---- GPS: u-blox MIA-M10Q (power via XL9555) ----
  -D ENV_INCLUDE_GPS=1
  -D ENV_SKIP_GPS_DETECT=1
  -D PIN_GPS_TX=2                 ; GPS TX -> ESP32 RX
  -D PIN_GPS_RX=16                ; GPS RX <- ESP32 TX
  -D GPS_BAUD_RATE=38400
  -D ENV_INCLUDE_AHTX0=0
  -D ENV_INCLUDE_BME280=0
  -D ENV_INCLUDE_BMP280=0
  -D ENV_INCLUDE_SHTC3=0
  -D ENV_INCLUDE_SHT4X=0
  -D ENV_INCLUDE_LPS22HB=0
  -D ENV_INCLUDE_INA3221=0
  -D ENV_INCLUDE_INA219=0
  -D ENV_INCLUDE_INA226=0
  -D ENV_INCLUDE_INA260=0
  -D ENV_INCLUDE_MLX90614=0
  -D ENV_INCLUDE_VL53L0X=0
  -D ENV_INCLUDE_BME680=0
  -D ENV_INCLUDE_BMP085=0
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/lilygo_tdeck_max>
  +<helpers/sensors/*.cpp>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}

; ---------------------------------------------------------------------------
;  Standalone UI + Bluetooth companion (use the device on its own, or pair the
;  MeshCore phone app at the same time). This is the main firmware.
; ---------------------------------------------------------------------------
[env:LilyGo_TDeck_Max_standalone_ble]
extends = LilyGo_TDeck_Max
; spell-check word list (SCOWL size 50 US, built by tools/make_dict.py)
board_build.embed_txtfiles = examples/companion_radio/ui-max/spell_words.txt
build_flags =
  ${LilyGo_TDeck_Max.build_flags}
  -I examples/companion_radio/ui-max
  -D DISPLAY_CLASS=TDeckMaxDisplay
  -D MAX_CONTACTS=500
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D BLE_PIN_CODE=123456
  -D MAXMESH_VERSION='"1.1"'
  -D FIRMWARE_VERSION='"v1.18.0-maxmesh1.1"'
build_src_filter = ${LilyGo_TDeck_Max.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-max/*.cpp>
lib_deps =
  ${LilyGo_TDeck_Max.lib_deps}
  densaugeo/base64 @ ~1.4.0
  zinggjm/GxEPD2 @ 1.6.9

; Repeater firmware for the T-Deck MAX (no UI)
[env:LilyGo_TDeck_Max_repeater]
extends = LilyGo_TDeck_Max
build_flags =
  ${LilyGo_TDeck_Max.build_flags}
  -D ADVERT_NAME='"TDeck MAX Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${LilyGo_TDeck_Max.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${LilyGo_TDeck_Max.lib_deps}
  ${esp32_ota.lib_deps}
